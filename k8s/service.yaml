apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: todo-app
  annotations:
    # Provisions an AWS Network Load Balancer via the cloud-provider integration
    # that ships with EKS. No extra controller install required for this.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: todo-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
